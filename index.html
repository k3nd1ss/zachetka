<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: на iPhone страница заходит под «чёлку» и полоску внизу -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Дневник студента</title>
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- Иконка на вкладке браузера -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- Иконка на главном экране: для iPhone и iPad, для остальных она указана в манифесте -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Дневник">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Путь относительный: иначе на GitHub Pages стили не загрузятся.
       ?v=… — номер версии. Браузер хранит файлы в кеше, и после обновления сайта
       мог бы показать старый style.css. Новый номер — новый адрес, и файл скачается заново.
       При каждой публикации увеличивай номер здесь и у app.js внизу страницы -->
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <!-- Фон: размытые шары, которые красятся в цвет оформления -->
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <header class="app-header">
    <h1 class="app-title">
      <!-- Значок нарисован прямо здесь, поэтому перекрашивается вместе с оформлением -->
      <svg class="app-logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <filter id="logo-blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="60"/>
          </filter>
          <clipPath id="logo-shape">
            <rect width="512" height="512" rx="114"/>
          </clipPath>
        </defs>
        <!-- Как иконка приложения: чёрная плитка, свечение в цвете оформления и белая галочка -->
        <rect width="512" height="512" rx="114" fill="#050507"/>
        <g clip-path="url(#logo-shape)" filter="url(#logo-blur)">
          <circle class="logo-orb" cx="110" cy="90" r="150" opacity="0.55"/>
          <circle class="logo-orb" cx="440" cy="460" r="130" opacity="0.3"/>
        </g>
        <rect x="7" y="7" width="498" height="498" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="14"/>
        <path class="logo-check" d="M156 266l70 70 134-162"/>
      </svg>
      <span>Дневник студента</span>
    </h1>

    <button id="settings-button" class="icon-button" type="button" aria-label="Настройки" title="Настройки">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/>
        <circle cx="15" cy="7" r="2"/>
        <circle cx="9" cy="17" r="2"/>
      </svg>
    </button>
  </header>

  <!-- Предупреждение появляется, только если с хранилищем что-то не так -->
  <p id="storage-warning" class="warning" role="alert" hidden></p>

  <!-- Сюда app.js выводит содержимое открытой вкладки -->
  <main id="content" class="content"></main>

  <!-- Панель вкладок внизу экрана, как в приложениях iPhone -->
  <nav class="tabs" aria-label="Разделы">
    <button class="tab" type="button" data-tab="subjects">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5z"/>
        <path d="M5 19.5A2.5 2.5 0 0 0 7.5 22H19v-5"/>
      </svg>
      <span class="tab-label">Предметы</span>
    </button>
    <button class="tab" type="button" data-tab="debts">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7v5l3 2"/>
      </svg>
      <span class="tab-label">Долги</span>
      <span id="debt-badge" class="tab-badge" hidden></span>
    </button>
    <button class="tab" type="button" data-tab="profile">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21a8 8 0 0 1 16 0"/>
      </svg>
      <span class="tab-label">Профиль</span>
    </button>
  </nav>

  <!-- Единственное окно: app.js показывает в нём шторку с формой или предупреждение -->
  <dialog id="modal" class="modal"></dialog>

  <!-- Меню выбора для выпадающих списков: app.js открывает его поверх всего, даже поверх шторки -->
  <dialog id="picker" class="picker" aria-label="Выбор варианта"></dialog>

  <!-- Номер версии тот же, что у style.css: файлы обновляются вместе -->
  <script src="app.js?v=3"></script>
</body>
</html>
