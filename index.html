<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дневник студента</title>
  <meta name="theme-color" content="#0f5c63">
  <!-- Иконка на вкладке браузера -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <!-- Иконка на главном экране: для iPhone и iPad, для остальных она указана в манифесте -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Дневник">
  <!-- Путь относительный: иначе на GitHub Pages стили не загрузятся -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">
      <!-- Значок нарисован прямо здесь, поэтому перекрашивается вместе с оформлением -->
      <svg class="app-logo" viewBox="0 0 512 512" aria-hidden="true">
        <rect class="logo-back" x="10" y="10" width="492" height="492" rx="104"/>
        <rect x="136" y="104" width="240" height="304" rx="20" fill="#f5f3ee"/>
        <path d="M156 104h28v304h-28a20 20 0 0 1-20-20V124a20 20 0 0 1 20-20z" fill="#c9c4b6"/>
        <rect class="logo-line" x="212" y="146" width="128" height="20" rx="10"/>
        <path class="logo-check" d="M220 284l44 44 80-96"/>
      </svg>
      Дневник студента
    </h1>

    <!-- На телефоне эта панель прижата к низу экрана, на компьютере стоит в шапке -->
    <nav class="tabs" aria-label="Разделы">
      <button class="tab" type="button" data-tab="subjects">Предметы</button>
      <button class="tab" type="button" data-tab="debts">Долги</button>
      <button class="tab" type="button" data-tab="profile">Профиль</button>
    </nav>

    <button id="settings-button" class="button" type="button">Настройки</button>
  </header>

  <!-- Предупреждение появляется, только если с хранилищем что-то не так -->
  <p id="storage-warning" class="warning" role="alert" hidden></p>

  <!-- Сюда app.js выводит содержимое открытой вкладки -->
  <main id="content" class="content"></main>

  <!-- Единственное модальное окно: app.js каждый раз наполняет его нужной формой -->
  <dialog id="modal" class="modal"></dialog>

  <script src="app.js"></script>
</body>
</html>
